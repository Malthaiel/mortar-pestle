name: Release

# Builds the Windows NSIS installer + updater artifacts (latest.json + .sig) and
# publishes them to a GitHub Release whenever a v* tag is pushed.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           contents of ~/.tauri/mortar-pestle_updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  contents of ~/.tauri/mortar-pestle_updater.password.txt
# Also: Settings → Actions → General → Workflow permissions = Read and write.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5   # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30   # stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32   # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix web ci

      - name: Verify web gates (WCAG AA + drag math)
        run: |
          npm --prefix web run check-themes
          npm --prefix web run check-drag

      - name: Build and publish release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5   # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Open beta: bundle Studio-tier modules (Video Editor, Game Capture,
          # STT) into public releases so they can be tested. At 1.0 these move
          # behind a paid subscription; revisit this flag then. Overrides the
          # gitignored web/.env (which sets the same locally).
          VITE_BUILD_TIER: studio
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Mortar & Pestle ${{ github.ref_name }}'
          releaseBody: |
            Mortar & Pestle ${{ github.ref_name }}.

            Install or update in-app from Settings ▸ System (or accept the on-launch prompt).
            The installer is not yet code-signed — Windows SmartScreen may warn; click More info → Run anyway.
          releaseDraft: false
          prerelease: false

      # tauri-action skips updater-JSON when the bundle name has spaces / `&`
      # (productName "Mortar & Pestle" → "Signature not found for the updater
      # JSON"). Rebuild latest.json from the published .exe + .exe.sig so the
      # in-app updater endpoint resolves. Idempotent (no-op if already present).
      - name: Ensure updater latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ensure-latest-json.mjs
