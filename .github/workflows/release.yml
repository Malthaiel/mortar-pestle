name: Release

# Builds the Windows NSIS installer + updater artifacts (latest.json + .sig) and
# publishes them to a GitHub Release whenever a v* tag is pushed.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           contents of ~/.tauri/mortar-pestle_updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  contents of ~/.tauri/mortar-pestle_updater.password.txt
# Also: Settings → Actions → General → Workflow permissions = Read and write.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5   # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30   # stable

      # STT is GPU-only since c937035: beforeBuildCommand builds it with
      # --features vulkan, and whisper-rs-sys on Windows needs the Vulkan SDK
      # (VULKAN_SDK + glslc), MSVC in env + the Ninja generator (the VS generator
      # can't hand a compiler to ggml's nested vulkan-shaders-gen configure), and
      # a short root (ggml's try-compile PDB path passes MAX_PATH from the repo
      # root; cl.exe ignores LongPathsEnabled). Same recipe as the local build —
      # see mortar-pestle-stt/Cargo.toml [features]. The short root is a real
      # worktree at C:\m, not a subst alias: Vite realpaths through a subst
      # drive and dies on the X:/D: mismatch (run 36659108525).
      - name: STT GPU build env (Vulkan SDK, MSVC, Ninja, short path)
        run: |
          $sdk = 'C:\VulkanSDK\1.4.350.0'
          Invoke-WebRequest https://sdk.lunarg.com/sdk/download/1.4.350.0/windows/vulkansdk-windows-X64-1.4.350.0.exe -OutFile "$env:RUNNER_TEMP\vulkansdk.exe"
          Start-Process "$env:RUNNER_TEMP\vulkansdk.exe" -ArgumentList 'install','--root',$sdk,'--accept-licenses','--default-answer','--confirm-command' -Wait
          if (-not (Test-Path "$sdk\Lib\vulkan-1.lib")) { throw "Vulkan SDK install failed" }
          "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV
          $env:PATH = "$sdk\Bin;$env:PATH"
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
            $k, $v = $_ -split '=', 2
            if ([Environment]::GetEnvironmentVariable($k) -ne $v) { Set-Item "env:$k" $v; "$k=$v" >> $env:GITHUB_ENV }
          }
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }
          "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
          git worktree add --detach C:\m HEAD
          Get-Command cl, ninja, glslc | Format-Table Name, Source

      - name: Cache Rust build
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32   # v2
        with:
          workspaces: C:\m\src-tauri

      - name: Install dependencies
        working-directory: C:\m
        run: |
          npm ci
          npm --prefix web ci

      # check-drag was retired with the FLIP drag rewrite (1135a5c).
      - name: Verify web gates (WCAG AA)
        working-directory: C:\m
        run: npm --prefix web run check-themes

      - name: Build and publish release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5   # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Open beta: bundle Studio-tier modules (Video Editor, Game Capture,
          # STT) into public releases so they can be tested. At 1.0 these move
          # behind a paid subscription; revisit this flag then. Overrides the
          # gitignored web/.env (which sets the same locally).
          VITE_BUILD_TIER: studio
          # Feedback Board (Supabase) — build.rs:13 panics on release builds
          # without these (fail loud so the board doesn't ship dead). Baked via
          # option_env! at compile time. Dev keeps the runtime env fallback.
          MORTAR_PESTLE_SUPABASE_URL: ${{ secrets.MORTAR_PESTLE_SUPABASE_URL }}
          MORTAR_PESTLE_SUPABASE_ANON_KEY: ${{ secrets.MORTAR_PESTLE_SUPABASE_ANON_KEY }}
        with:
          # Short root for the STT vulkan build (worktree made above).
          projectPath: C:\m
          tagName: ${{ github.ref_name }}
          releaseName: 'Mortar & Pestle ${{ github.ref_name }}'
          releaseBody: |
            Mortar & Pestle ${{ github.ref_name }}.

            Install or update in-app from Settings ▸ System (or accept the on-launch prompt).
            The installer is not yet code-signed — Windows SmartScreen may warn; click More info → Run anyway.
          releaseDraft: false
          prerelease: false

      # tauri-action skips updater-JSON when the bundle name has spaces / `&`
      # (productName "Mortar & Pestle" → "Signature not found for the updater
      # JSON"). Rebuild latest.json from the published .exe + .exe.sig so the
      # in-app updater endpoint resolves. Idempotent (no-op if already present).
      - name: Ensure updater latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ensure-latest-json.mjs
