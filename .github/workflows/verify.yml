name: Verify
on:
  push:
    branches: ['**']   # branch pushes only — tag pushes are handled by release.yml
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5   # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4
        with:
          node-version: 20
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30   # stable
      - name: Cache Rust build
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32   # v2
        with:
          workspaces: src-tauri
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix web ci
      - name: Build web (so app_lib tests compile)
        run: npm --prefix web run build
      - name: Fetch bundled resources (usda_foods.db)
        # cargo test compiles the app crate → tauri_build validates bundle.resources.
        # `usda_foods.db` is normally populated by tauri's beforeBuildCommand, which a
        # bare `cargo test` skips — fetch it explicitly so the build doesn't panic.
        run: node scripts/fetch-usda-db.mjs
      - name: Run verification baseline
        run: node scripts/verify.mjs
