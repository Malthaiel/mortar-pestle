[package]
name = "mortar-pestle-stt"
version = "0.1.0"
edition = "2021"
description = "Speech-to-text engine: Unix-socket NDJSON daemon driving local Whisper transcription. Windowless. SF2: resident whisper-rs model + batch whisper_full (file mode)."
publish = false

[features]
# GPU backend is a one-line whisper-rs cargo feature (research-locked). `vulkan` is the
# prod REQUIREMENT, passed by BOTH tauri configs' beforeBuildCommand — a featureless build
# has no GPU code compiled in, and since 2026-07-19 `whisper::load_ctx` HARD-ERRORS in that
# case instead of running on CPU (CPU whisper pins every core; see the module header).
# `cuda` is OPT-IN and NON-DEFAULT (Phase 4 SF2 — attempt-only on this host: nvcc 13.0
# rejects host gcc 15.2, no older g++ to pin via CUDAHOSTCXX, so it stays inert here).
#
# WINDOWS BUILD ENV (proven 2026-07-19 — a plain `cargo build --features vulkan` FAILS):
#   1. MSVC env loaded  — `call "…\BuildTools\VC\Auxiliary\Build\vcvars64.bat"`, else the
#      nested `vulkan-shaders-gen` ExternalProject configure dies with
#      "No CMAKE_C_COMPILER could be found".
#   2. `set "CMAKE_GENERATOR=Ninja"` — the VS generator can't hand a compiler to that
#      nested configure. (Quote the set: `set X=Ninja &&` appends a trailing space.)
#   3. Build from a SHORT path — `subst X: C:\Users\malth\Code\mortar-pestle`, then build
#      from `X:\`. The ggml try-compile PDB path is 268 chars from the real repo root;
#      cl.exe ignores the OS long-path flag and fails with C1041.
default = []
vulkan = ["whisper-rs/vulkan"]
cuda = ["whisper-rs/cuda"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Shared NDJSON daemon transport/framing (D5-WI-1 sidecar dedup). 3-way tier
# (framing/clock/pipe) + 2-way tier (envelope/sock) consumed per sidecar.
mortar-pestle-daemon = { path = "../mortar-pestle-daemon" }
# SF2 dependency add (ask-first gate, user-approved 2026-06-16). whisper-rs vendors
# whisper.cpp (offline C/C++/CMake build); symphonia decodes the input file to f32
# PCM. Containers: wav natively, plus isomp4/mkv (+ the aac codec inside them) so a
# recorded clip or an OBS capture decodes without a pre-convert step — `decode_to_16k_mono`
# probes by extension and is already container-agnostic, so this list IS the whole surface.
whisper-rs = { version = "0.16" }
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "isomp4", "mkv", "aac"] }
# SF3 dependency add (ask-first gate, user-approved 2026-06-16). ureq: blocking, minimal
# HTTP client (rustls TLS, no system OpenSSL) for fetch-on-demand model download on the
# blocking whisper worker thread; sha2: verifies the published HuggingFace git-LFS SHA256
# OID as the bytes stream, before the temp file is atomically committed to the cache.
ureq = "2"
sha2 = "0.10"
# Scrim Coaching sub-plan 6 SF1 dependency add (ask-first gate, user-approved 2026-07-09).
# sherpa-onnx: safe Rust bindings to the k2-fsa sherpa-onnx C API — drives OFFLINE speaker
# diarization (pyannote-segmentation-3.0 + a 3D-Speaker embedder) for the comms transcript.
# The build script DOWNLOADS a prebuilt lib archive from GitHub releases (no local CMake/C++
# build). `shared` (DLL) not the default `static`: the prebuilt STATIC lib is compiled
# against the static CRT (/MT → LIBCMT), which multiply-defines against Rust + whisper.cpp's
# dynamic CRT (/MD) → LNK1169 (proven at the SF1 gate 2026-07-09). The shared build links the
# dynamic CRT, matching. The plan's pre-approved fallback ("try static; else DLL-bundle").
# Runtime: the onnxruntime + sherpa DLLs must sit beside the sidecar binary (bundle step).
sherpa-onnx = { version = "1.12", default-features = false, features = ["shared"] }
# Phase 2 SF1 dependency add (ask-first gate, user-approved 2026-06-16). cpal: the
# locked cross-platform mic API (Linux backend = ALSA via alsa-sys → needs
# alsa-lib-devel at build time); opens the default input device and streams native
# frames. rubato: anti-aliased sample-rate conversion (device-native 44.1/48 kHz →
# the 16 kHz mono f32 whisper audio contract). Both backend-independent of the
# vulkan feature.
cpal = "0.15"
rubato = "0.15"

# Push-to-talk deps are per-OS (STT Windows port SF5). Linux drives it through the XDG
# GlobalShortcuts portal (ashpd: typed portal client; futures-util: StreamExt over the
# Activated/Deactivated signal streams). Windows uses a WH_KEYBOARD_LL low-level
# keyboard hook (windows-sys) — no portal, no D-Bus.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", features = ["global_shortcuts"] }
futures-util = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    # GetAsyncKeyState — the modifier gate on the scrim chord (Alt+Space).
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

